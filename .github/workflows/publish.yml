name: Publish to PyPI

# OIDC-only (ADR-278): kein Token, Trusted Publisher auf PyPI = (achimdehnert/iil-testkit, publish.yml, environment pypi).
# Loest den platform-seitigen Token-Publisher publish-iil-testkit.yml ab (KONZ-052 V1).
# Gates vor dem irreversiblen Upload: Tests, Tag == pyproject.version, gitleaks auf dem gebauten Artefakt (ADR-226).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Upload target"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  test:
    name: Tests (publish gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: "Run tests (wie CI: tests/, ohne Plugin-Tests)"
        run: pytest tests/ --ignore=tests/plugin --tb=short -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install hatchling twine
      - name: Read version from pyproject.toml
        id: meta
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"
      - name: Tag must equal pyproject version (K3, ADR-266)
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::Tag v$TAG != pyproject version ${{ steps.meta.outputs.version }} — kein Upload"
            exit 1
          fi
      - name: Build wheel + sdist
        run: |
          rm -rf dist
          python -m hatchling build
          ls -la dist/
      - name: Check
        run: twine check dist/*
      # ADR-226 binding gate: scan the EXACT bytes about to be uploaded.
      - name: Pre-publish secret gate (built artifact)
        uses: achimdehnert/platform/.github/actions/gitleaks-scan@main
        with:
          mode: sdist
          source: dist
          report_escape_hatch: "false"
          context_label: "pre-publish: iil-testkit"
          triage_hint: "A secret is in the artifact about to be published to PyPI (irreversible). ROTATE it and exclude it from the build. NOT suppressible."
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.meta.outputs.version }}
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/project/iil-testkit/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/
      - name: Publish to PyPI (Trusted Publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          skip-existing: true

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/iil-testkit/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
