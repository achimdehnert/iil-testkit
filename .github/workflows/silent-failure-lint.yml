name: Silent-Failure-Lint

# Konsumiert iilgmbh/shared-ci:tools/check_silent_failures.py (SSoT, via workflow-guards) — Gate gegen
# Melder, die beim Ausfall schweigen (Anlass: platform#1587, Megatest lief
# zwei Wochen still nicht).
#
# Bewusst Direkt-Checkout statt workflow_call: der platform-Reusable checkt
# nur den Caller aus und faende das Tool dort nicht (Stand 2026-08-02).
# Das Tool ist die eine Quelle; dieses Yml ist nur Verdrahtung.
on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**']

permissions:
  contents: read

jobs:
  silent-failure-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Prüfer liegt im CI-Kanon iilgmbh/shared-ci (platform wird privat, platform#3234).
      # Bewusst NICHT weichgestellt: ein Gate, das seinen eigenen Fehlschlag
      # verschluckt, waere genau der Fehler, den es sucht.
      - uses: iilgmbh/shared-ci/.github/actions/workflow-guards@main
        with:
          checks: silent-failures
          workflows_dir: .github/workflows
