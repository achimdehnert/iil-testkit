# ci.yml — Thin-Caller auf das ADR-226-Reusable (platform ADR-266 Stufe 2b).
# Semantik (Lint, Secret-Scan, Test+Coverage, Build+Artefakt-Scan, pip-audit)
# lebt zentral in iilgmbh/shared-ci/.github/workflows/_ci-pypi.yml — Verbesserungen
# erreichen alle Pakete in O(1). Inputs abgeleitet aus der Vorgänger-ci.yml
# (ADR-242 Wave-3 Phase-2-Konvergenz, platform#811).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: iilgmbh/shared-ci/.github/workflows/_ci-pypi.yml@v1.1.11
    with:
      python_versions: '["3.12"]'
      coverage_threshold: 80
      install_extra: 'dev'
      cov_package: 'iil_testkit'
      test_path: 'tests/'
      pytest_args: '--ignore=tests/plugin'
      enable_mypy: true
      mypy_args: 'iil_testkit/'
